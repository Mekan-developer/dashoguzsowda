services:
  app:       { volumes: !override [ storage_app:/var/www/dzsowda/storage/app ] }
  horizon:   { volumes: !override [ storage_app:/var/www/dzsowda/storage/app ] }
  reverb:    { volumes: !override [ storage_app:/var/www/dzsowda/storage/app ] }
  scheduler: { volumes: !override [ storage_app:/var/www/dzsowda/storage/app ] }
  artisan:   { volumes: !override [ storage_app:/var/www/dzsowda/storage/app ] }

  nginx:
    image: dzsowda-nginx:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx
      args:
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-https://nexus.telecom.tm/repository/composer-proxy/}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://nexus.telecom.tm/repository/npm-proxy/}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    volumes: !override
      - storage_app:/var/www/dzsowda/storage/app:ro

volumes:
  storage_app:
