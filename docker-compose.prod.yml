# Прод-оверрайд: docker compose -f docker-compose.yml -f docker-compose.prod.yml
#
# Код живёт в образе, с хоста монтируются только:
#  - .env — его нет в образе (.dockerignore), а entrypoint и config:cache
#    читают именно файл: env_file одних переменных окружения не хватает;
#  - ключ Firebase — storage/app здесь именованный том, папка с хоста туда
#    сама не попадает, а без ключа push не уходят;
#  - storage_app — загрузки пользователей.
services:
  app:
    volumes: !override
      - storage_app:/var/www/dzsowda/storage/app
      - ./.env:/var/www/dzsowda/.env:ro
      - ./storage/app/firebase:/var/www/dzsowda/storage/app/firebase:ro
    # Миграции — только здесь, остальные PHP-контейнеры их не трогают
    environment:
      RUN_MIGRATIONS: "true"
  horizon:
    volumes: !override
      - storage_app:/var/www/dzsowda/storage/app
      - ./.env:/var/www/dzsowda/.env:ro
      - ./storage/app/firebase:/var/www/dzsowda/storage/app/firebase:ro
  reverb:
    volumes: !override
      - storage_app:/var/www/dzsowda/storage/app
      - ./.env:/var/www/dzsowda/.env:ro
      - ./storage/app/firebase:/var/www/dzsowda/storage/app/firebase:ro
  scheduler:
    volumes: !override
      - storage_app:/var/www/dzsowda/storage/app
      - ./.env:/var/www/dzsowda/.env:ro
      - ./storage/app/firebase:/var/www/dzsowda/storage/app/firebase:ro
  artisan:
    volumes: !override
      - storage_app:/var/www/dzsowda/storage/app
      - ./.env:/var/www/dzsowda/.env:ro
      - ./storage/app/firebase:/var/www/dzsowda/storage/app/firebase:ro

  # Пароль из REDIS_PASSWORD того же .env, что читает Laravel. Пусто или
  # «null» (так Laravel понимает «без пароля») — redis-server без пароля
  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - '[ "$$REDIS_PASSWORD" = null ] && REDIS_PASSWORD=; exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$REDIS_PASSWORD\" ] && [ \"$$REDIS_PASSWORD\" != null ] && export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]

  sms-gateway:
    ports:
      - "3000:3000"

  nginx:
    image: dzsowda-nginx:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx
      args:
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-https://nexus.telecom.tm/repository/composer-proxy/}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://nexus.telecom.tm/repository/npm-proxy/}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    volumes: !override
      - storage_app:/var/www/dzsowda/storage/app:ro

volumes:
  storage_app:
