x-php: &php
  image: dzsowda-php:local
  env_file: [.env]
  user: "${UID:-1000}:${GID:-1000}"
  restart: unless-stopped
  depends_on:
    db:    { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  app:
    <<: *php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        APT_MIRROR: ${APT_MIRROR:-https://nexus.telecom.tm/repository/debian-proxy}
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-https://nexus.telecom.tm/repository/composer-proxy/}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://nexus.telecom.tm/repository/npm-proxy/}
    container_name: dzsowda_app

  nginx:
    image: nginx:1.27-alpine
    container_name: dzsowda_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./docker/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  horizon:
    <<: *php
    container_name: dzsowda_horizon
    command: php artisan horizon
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3

  reverb:
    <<: *php
    container_name: dzsowda_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    expose: ["8080"]

  scheduler:
    <<: *php
    container_name: dzsowda_scheduler
    command: php artisan schedule:work

  artisan:
    <<: *php
    entrypoint: ["php", "/var/www/dzsowda/artisan"]
    profiles: ["tools"]
    restart: "no"

  sms-gateway:
    build:
      context: ./socket-server
    image: dzsowda-sms:local
    container_name: dzsowda_socket
    restart: unless-stopped
    env_file: [./socket-server/.env]
    environment:
      OTP_SECRET: ${OTP_SECRET:-dev-otp-secret}
      ENABLE_TEST_PAGE: ${SMS_GATEWAY_TEST_PAGE:-true}

  db:
    image: mysql:8.0
    container_name: dzsowda_mysql
    restart: unless-stopped
    env_file: [docker/db.env]
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: dzsowda_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
