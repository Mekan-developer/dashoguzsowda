x-php-build: &php-base
  image: dzsowda-php:local
  env_file:
    - .env
  depends_on:                        # CHANGED: было списком, стало с условиями
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php-base
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    user: "${UID:-1000}:${GID:-1000}"
    container_name: dzsowda_app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: dzsowda_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *php-base
    container_name: dzsowda_queue
    user: www-data
    command: php artisan queue:work --tries=3 --backoff=5 --max-time=3600
    restart: unless-stopped

  reverb:
    <<: *php-base
    container_name: dzsowda_reverb
    user: www-data
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    expose:
      - 8080

  scheduler:
    <<: *php-base
    container_name: dzsowda_scheduler
    user: www-data
    command: php artisan schedule:work
    restart: unless-stopped

  artisan:
    <<: *php-base
    entrypoint: ["php", "/var/www/dzsowda/artisan"]
    user: www-data
    profiles: ["tools"]
    restart: "no"

  db:
    image: mysql:8.0
    container_name: dzsowda_mysql
    restart: unless-stopped
    env_file:
      - docker/db.env
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:                     # NEW
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: dzsowda_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:                     # NEW
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  sms-gateway:
    image: node:22-alpine
    container_name: dzsowda_socket
    working_dir: /var/www/socket-server
    command: sh -c "npm ci --omit=dev && node index.js"
    environment:
      OTP_SECRET: ${OTP_SECRET:-dev-otp-secret}
      ENABLE_TEST_PAGE: ${SMS_GATEWAY_TEST_PAGE:-true}
    volumes:
      - ./socket-server:/var/www/socket-server
      - sms_node_modules:/var/www/socket-server/node_modules
    env_file:
      - ./socket-server/.env
    restart: unless-stopped

