# Базовый стек. Поверх него:
#   dev  — docker-compose.override.yml (подключается сам: docker compose up)
#   прод — docker-compose.prod.yml, см. docs/DEPLOY.md
#
# Имя проекта задаёт имена томов (<имя>_db_data …). Сменится — compose
# создаст новые пустые тома, поэтому оно закреплено. Локально его
# переопределяет COMPOSE_PROJECT_NAME из .env.
name: dashoguzsowda

x-php: &php
  image: dzsowda-php:local
  env_file: [.env]
  user: "${UID:-1000}:${GID:-1000}"
  restart: unless-stopped
  depends_on:
    db:    { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  app:
    <<: *php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        APT_MIRROR: ${APT_MIRROR:-https://nexus.telecom.tm/repository/debian-proxy}
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-https://nexus.telecom.tm/repository/composer-proxy/}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://nexus.telecom.tm/repository/npm-proxy/}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    container_name: dzsowda_app

  horizon:
    <<: *php
    container_name: dzsowda_horizon
    command: php artisan horizon
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3

  reverb:
    <<: *php
    container_name: dzsowda_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    expose: ["8080"]

  scheduler:
    <<: *php
    container_name: dzsowda_scheduler
    command: php artisan schedule:work

  # Разовые команды: docker compose run --rm artisan migrate:status
  artisan:
    <<: *php
    entrypoint: ["php", "/var/www/dzsowda/artisan"]
    profiles: ["tools"]
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: dzsowda_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on: [app, reverb]

  sms-gateway:
    build:
      context: ./socket-server
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://nexus.telecom.tm/repository/npm-proxy/}
    image: dzsowda-sms:local
    container_name: dzsowda_socket
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET is required}
      OTP_EVENT_NAME: ${SMS_GATEWAY_OTP_EVENT:-otp}
      ENABLE_TEST_PAGE: ${SMS_GATEWAY_TEST_PAGE:-false}

  # Учётные данные — те же DB_*, что у Laravel. Применяются только при
  # первой инициализации пустого тома, у живой базы ничего не меняют
  db:
    image: mysql:8.0
    container_name: dzsowda_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      # Без пароля: mysqladmin ping отвечает 0, если сервер жив, даже при
      # отказе в доступе — проверка не зависит от того, с какими кредами
      # инициализировали том
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: dzsowda_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
