x-php-build: &php-dev
  volumes:
    - ./:/var/www/dzsowda
  restart: "no"

services:
  app:
    <<: *php-dev

  nginx:
    restart: "no"
    ports: !override
      - 8900:80
    volumes:
      - ./docker/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/dzsowda

  queue:
    <<: *php-dev
    command: php artisan queue:listen --tries=3 --backoff=5

  reverb:
    <<: *php-dev
    ports:
      - 8070:8080

  scheduler:
    <<: *php-dev

  artisan:
    <<: *php-dev

  node:
    <<: *php-dev
    command: sh -c "npm ci && npm run dev"
    ports:
      - 5273:5173

  sms-gateway:
    ports:
      - 3100:3000
    restart: "no"

  db:
    restart: "no"
    ports:
      - 3366:3306

  redis:
    restart: "no"
    ports:
      - "6369:6379"
