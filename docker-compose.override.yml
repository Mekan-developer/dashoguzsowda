x-dev: &dev
  volumes:
    - ./:/var/www/dzsowda
    - /var/www/dzsowda/vendor
    - /var/www/dzsowda/bootstrap/cache
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
  restart: "no"

services:
  app:       { <<: *dev }
  horizon:   { <<: *dev }
  reverb:
    <<: *dev
    ports: ["8080:8080"]
  scheduler: { <<: *dev }
  artisan:   { <<: *dev }
  nginx:
    restart: "no"
    ports: !override ["8000:80"]
    volumes:
      - ./docker/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/dzsowda

  sms-gateway:
    restart: "no"
    ports: ["3000:3000"]
    volumes:
      - ./socket-server:/var/www/socket-server
      - sms_node_modules:/var/www/socket-server/node_modules
    command: node index.js

  node:
    image: node:22
    container_name: dzsowda_node
    working_dir: /var/www/dzsowda
    user: "${UID:-1000}:${GID:-1000}"
    restart: "no"
    command: sh -c "npm ci && npm run dev"
    ports: ["5173:5173"]
    volumes:
      - ./:/var/www/dzsowda

  db:    { restart: "no", ports: ["3366:3306"] }
  redis: { restart: "no", ports: ["6379:6379"] }

volumes:
  sms_node_modules:
