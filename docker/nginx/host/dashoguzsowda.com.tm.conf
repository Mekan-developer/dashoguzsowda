# nginx на самом сервере (не в контейнере): TLS для dashoguzsowda.com.tm и
# прокси в docker. Заменяет Caddy, который делал ровно то же.
#
# Установка (подробно — docs/DEPLOY.md, раздел «Хостовый nginx»):
#   sudo cp /srv/dashoguzsowda/docker/nginx/host/dashoguzsowda.com.tm.conf \
#           /etc/nginx/sites-available/dashoguzsowda.com.tm
#   sudo ln -s /etc/nginx/sites-available/dashoguzsowda.com.tm /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификаты — свои, не Let's Encrypt:
#   /etc/nginx/ssl/dashoguzsowda.com.tm/fullchain.pem  домен + промежуточные CA
#   /etc/nginx/ssl/dashoguzsowda.com.tm/privkey.pem    ключ без пароля, chmod 600

# Connection для WebSocket: upgrade — когда клиент просит, иначе close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashoguzsowda.com.tm;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashoguzsowda.com.tm;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/dashoguzsowda.com.tm/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dashoguzsowda.com.tm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dashoguzsowda_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Вровень с контейнерным nginx и post_max_size в php.prod.ini — видео до 150M
    client_max_body_size 150M;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/dashoguzsowda.com.tm.access.log;
    error_log  /var/log/nginx/dashoguzsowda.com.tm.error.log;

    # OTP-шлюз — как было в Caddy. Сам телефон ходит напрямую на :3000,
    # а это нужно странице-тестеру (SMS_GATEWAY_TEST_PAGE=true): с https она
    # может обращаться только к своему origin
    location = /test-otp.html {
        proxy_pass http://127.0.0.1:3000/test;
        proxy_set_header Host $host;
    }

    # /otp/socket.io/*, /otp/emit-otp → шлюз без префикса /otp
    location /otp/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Всё остальное — контейнерный nginx: админка, API, статика, Reverb (/app)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket Reverb идёт этим же location
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Host как есть: из него Laravel строит абсолютные ссылки
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Вровень с fastcgi_read_timeout контейнера
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Загрузки идут в контейнер потоком, без промежуточного файла на хосте
        proxy_request_buffering off;
    }
}
