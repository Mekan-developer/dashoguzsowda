# nginx стоит за Caddy (TLS терминируется там), поэтому слушает только 80
# во внутренней docker-сети и наружу не публикуется.

# Реальный IP клиента вместо адреса Caddy в логах и в request()->ip().
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/public;
    # index.html нужен для статической API-документации в public/docs/.
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    server_tokens off;

    # Reverb (WebSocket). Caddy проксирует всё на nginx, а nginx разводит
    # /app* на Reverb, остальное — на php-fpm.
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # WebSocket-соединение должно жить долго.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Собранные Vite-ассеты: имена содержат хэш, можно кэшировать навсегда.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Загрузки пользователей (public/storage → storage/app/public, named-том).
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Точки входа, кроме index.php, недоступны. Должно стоять ДО общего \.php$:
    # nginx выбирает первую совпавшую regex-локацию.
    location ~ ^/(?!index\.php$).*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Долгие запросы: сборка chunked-загрузки видео.
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /dev/stderr warn;
    access_log /dev/stdout;
}
