# Контейнерный nginx: статика public/, PHP → app:9000, WebSocket → reverb:8080.
# В проде перед ним хостовый nginx (TLS, docker/nginx/host/), в dev — никого.

# Настоящий IP клиента приходит от хостового nginx в X-Forwarded-For.
# Доверяем заголовку только с приватных адресов (docker-шлюз, localhost).
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Схема и порт, какими сайт открыт снаружи. Хостовый nginx присылает их в
# X-Forwarded-Proto/Port; в dev заголовков нет — берём свою схему и порт из
# Host, иначе Laravel строил бы ссылки без порта (http://IP/login вместо :8000).
map $http_x_forwarded_proto $forwarded_proto {
    ""       $scheme;
    default  $http_x_forwarded_proto;
}

map $http_host $host_port {
    "~:(?<hostport>\d+)$"  $hostport;
    default                "";
}

map "$http_x_forwarded_port:$host_port:$forwarded_proto" $forwarded_port {
    "~^(?<fwdport>\d+):"   $fwdport;
    "~^:(?<hport>\d+):"    $hport;
    "~^::https$"           443;
    default                $server_port;
}

server {
    listen 80;
    # Домен разбирает хостовый nginx, сюда доходит уже отобранный трафик
    server_name _;
    server_tokens off;

    root /var/www/dzsowda/public;
    index index.php;
    charset utf-8;

    # Держать вровень с хостовым nginx и post_max_size в php.prod.ini:
    # режет по меньшему, и обрыв выглядит как 413 без строки в логах Laravel
    client_max_body_size 150M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Адреса app и reverb резолвятся при каждом запросе (через переменную):
    # после пересоздания контейнера у него новый IP, а без resolver nginx
    # держал бы старый до своего рестарта и отдавал 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream    app:9000;
    set $reverb_upstream reverb:8080;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Vite именует файлы по хэшу содержимого — их можно кэшировать навсегда
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverb (Pusher-протокол): /app/{key} — WebSocket браузера админки
    location ~ ^/(app|apps)/ {
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # В public один php-файл — точка входа. Остальное с .php исполнять незачем
    location = /index.php {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Laravel доверяет X-Forwarded-* от кого угодно (trustProxies at: '*'),
        # поэтому значения ставятся здесь, а не пробрасываются как пришли:
        # подменённый Host увёл бы абсолютные ссылки на чужой домен
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $forwarded_port;

        # Как было: запас на приём крупных загрузок (видео до 150M)
        fastcgi_read_timeout 300s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
