; Прод-конфигурация PHP. Dev — docker/php/php.ini.
memory_limit = 512M
upload_max_filesize = 120M
post_max_size = 150M
max_execution_time = 120
max_input_vars = 3000
date.timezone = Asia/Ashgabat

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
error_log = /proc/self/fd/2
; Требует catch_workers_output = yes в конфиге пула FPM.

zend.assertions = -1

opcache.enable = 1
; Включён и для CLI: horizon/reverb/scheduler — долгоживущие процессы.
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Код внутри образа неизменяем — проверять mtime файлов не нужно.
; ВАЖНО: на каждый деплой нужен рестарт FPM и воркеров.
opcache.validate_timestamps = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
