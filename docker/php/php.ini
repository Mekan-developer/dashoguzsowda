; Dev-конфигурация PHP. Прод — docker/php/php.prod.ini.
memory_limit = 512M
upload_max_filesize = 120M
max_file_uploads = 50
max_input_vars = 3000
post_max_size = 150M
max_execution_time = 120
date.timezone = Asia/Ashgabat

; Docker bind-mount на Windows — иначе много лишних stat()
realpath_cache_size = 4096k
realpath_cache_ttl = 600

opcache.enable = 1
; Пересчитывать mtime файлов на каждый запрос — иначе правки кода не подхватятся.
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
