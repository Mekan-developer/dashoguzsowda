; Переопределяет дефолтный пул php-fpm (www.conf) в prod-образе.
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Перезапуск воркера после N запросов — страховка от утечек памяти.
pm.max_requests = 500

; Логи воркеров идут в stderr контейнера, а не в файл внутри образа.
catch_workers_output = yes
decorate_workers_output = no

; Медленные запросы (>10s) с бэктрейсом — в лог контейнера.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
